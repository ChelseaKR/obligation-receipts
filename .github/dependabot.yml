version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # `release.yml` pins a reusable workflow from ChelseaKR/.github. It used to
    # pin the same workflow in ChelseaKR/portfolio-standards, a *private*
    # repository that Dependabot's repo-scoped credentials could not read: the
    # proxy logged `403 ... Either the repo doesn't exist, or Dependabot doesn't
    # have access to it`, the updater recorded `git_dependencies_not_reachable`
    # for that one dependency, and a single recorded error failed the entire
    # run even though every other action had been checked. That is what made the
    # weekly `Dependabot Updates` job red on 2026-07-24, 07-31, 08-07, 08-14 and
    # 08-21 while the sibling `pip` job stayed green throughout.
    #
    # That is no longer the reason. The pin now names a *public* repository,
    # which Dependabot can read, so the unreachable fetch cannot happen and the
    # weekly failure this block was written to prevent is gone.
    #
    # The entry is kept because `tests/test_supply_chain.py` requires every
    # cross-repository reusable-workflow pin to be ignored, and relaxing that
    # rule is a decision about the gate rather than a side effect of moving a
    # pin. What it costs is what it always cost: this pin is not bumped
    # automatically and must be bumped by hand.
    #
    # To restore automatic updates, delete this `ignore` block and amend
    # `test_dependabot_ignore_list_matches_the_cross_repo_reusable_workflow_pins`
    # so it requires an ignore entry only for pins Dependabot genuinely cannot
    # read. No credential, registry block or PAT is needed any more -- the
    # workflow is public.
    ignore:
      - dependency-name: ChelseaKR/.github/.github/workflows/release-authorize.yml
