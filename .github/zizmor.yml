# zizmor configuration. See https://docs.zizmor.sh/configuration/
#
# `impostor-commit` is disabled repo-wide because it cannot run at all: it
# needs the GitHub API to confirm that a pinned commit SHA belongs to the
# referenced repo, and release.yml's `authorize` job pins
# ChelseaKR/portfolio-standards/.github/workflows/release-authorize.yml --
# a *different*, private repo that this workflow's repo-scoped
# GITHUB_TOKEN cannot read. zizmor does not fail closed on that access
# error; it aborts the whole audit for the file before it reaches any
# other `uses:` line, so per-line `ignore` cannot scope around it (see
# https://github.com/zizmorcore/zizmor -- BaseRuleConfig.ignore filters
# findings after a successful run; it cannot suppress an audit-level
# error). Verified locally: `zizmor --gh-token <token-without-access>`
# reproduces the exact CI failure, and it is unaffected by an `ignore`
# entry for that line.
#
# What this trades away: automated confirmation that a pinned SHA in this
# repo's own workflows resolves to a real tag on its origin repo.
# Everything else zizmor checks (unpinned-uses, stale-action-refs,
# known-vulnerable-actions, ref-confusion, ref-version-mismatch, and the
# offline audits) stays active for every `uses:` line, including the
# public actions in these workflows.
#
# The disable is repo-wide, so what it leaves unchecked is repo-wide too.
# This said "the one pin this leaves unchecked -- release.yml:20", which
# was the one pin that MOTIVATED the disable, not the extent of it: the
# rule is off for every pinned reference in both workflow files, 9 distinct
# refs, 8 of them public actions the token can read perfectly well. The
# private pin is the reason; it is not the scope.
#
# That is why the `zizmor` job in ci.yml carries one more step, "Resolve
# every pinned SHA against the repository it names". It asks the identity
# question this rule is off for, on all 8 readable pins, and skips only
# ChelseaKR/portfolio-standards -- which stays verified by hand before
# every bump: the SHA must resolve to a signed, tagged commit on
# portfolio-standards. It also asks it a way `gh api
# repos/<owner>/<repo>/commits/<sha>` cannot: forks share the upstream
# object store, so that endpoint returns 200 for a commit that exists only
# in a fork. The job matches the SHA against the named repository's own tag
# refs, which forks do not share.
#
# Re-enable once the zizmor job is given a credential that can read
# portfolio-standards (e.g. a fine-grained PAT with contents:read on that
# repo specifically, passed as the zizmor-action `token:` input) rather
# than relying on this repo's own GITHUB_TOKEN.
rules:
  impostor-commit:
    disable: true
