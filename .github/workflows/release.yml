name: release

# Trusted-main release. After pushing a signed annotated tag, the maintainer
# dispatches this workflow from `main` and supplies the tag as an input.
# `workflow_dispatch` is deliberate: a tag-push trigger would execute the
# workflow definition stored at the tagged ref, while the release authority has
# to come from the reviewed workflow on trusted `main`.
#
#   git tag -s vX.Y.Z -m "vX.Y.Z" && git push origin vX.Y.Z
#   gh workflow run release.yml --ref main -f tag=vX.Y.Z
#
# THIS WORKFLOW NOW HOLDS PUBLICATION AUTHORITY, WHICH IT PREVIOUSLY DID NOT.
# Until 2026-09-06 it built, attested and signed a candidate and stopped there;
# `docs/RELEASE.md` and WVR-009 recorded that as a decision rather than a gap.
# The publication half is confined to two jobs -- `github-release` and
# `pypi-publish` -- which never check out or execute repository code, never
# rebuild, and republish only the exact bytes the `build` job attested.
# `tests/test_supply_chain.py` asserts that confinement as a merge-blocking
# boundary; every other workflow in this repository is still forbidden to
# publish anything at all.
#
# PyPI upload uses Trusted Publishing over OIDC. There is no API token in this
# repository's secret store and none may be added: the publish job's identity is
# the OIDC claim GitHub mints for `pypi-publish` in the `pypi` environment, and
# PyPI has to be told to trust it once, by hand, before the job can work.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

# One global group: two versions can never build or publish concurrently, and a
# re-run queues behind a live publish instead of racing it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Step 0, trust: the standards-owned reusable workflow checks out this
  # repository's reviewed `main`, rejects non-stable or lightweight tags,
  # verifies the SSH signer against the committed `.github/allowed_signers`,
  # proves the tagged commit is reachable from current `origin/main`, and
  # returns immutable identifiers. Pinned to a full 40-character commit SHA.
  authorize:
    uses: ChelseaKR/.github/.github/workflows/release-authorize.yml@7be4c3e44e2acf20e8a98eeea4351c1e5d2789bc
    permissions:
      contents: read
    with:
      tag: ${{ inputs.tag }}

  build:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      # Single source of truth for which tag this run builds. Referenced as
      # "$RELEASE_TAG" inside `run:` bodies and never interpolated through
      # `${{ }}` into a shell, which would be a template-injection vector even
      # though `authorize` has already held the value to a SemVer pattern.
      RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: false
      - name: Require tag and package versions to match
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
      # The release notes are the CHANGELOG section, so a missing section is a
      # release with no notes. Checked here, before anything is built, rather
      # than discovered by the extraction step after the artifacts are signed.
      - name: Require a CHANGELOG section for this release
        run: |
          set -euo pipefail
          grep -q "^## \[${RELEASE_TAG#v}\]" CHANGELOG.md || {
            echo "::error::CHANGELOG.md has no section for ${RELEASE_TAG}"
            exit 1
          }
      # `--locked`, not `--frozen`. `--frozen` installs exactly what uv.lock
      # records and never reads pyproject.toml, so it cannot see the two
      # disagree. A release is the one change guaranteed to desynchronise
      # them -- the version bump lands in pyproject.toml and the lock has to
      # be re-resolved to match -- so this is the path on which `--frozen`
      # was least able to notice and most likely to be wrong: it would have
      # built a candidate for the tagged version out of a lock still
      # recording the previous one.
      #
      # This is also the gate that stands between an arbitrary tagged commit
      # and a published distribution. Nothing below it signs, attests or
      # uploads anything unless it passes at the exact authorized commit.
      - name: Verify and build candidate
        run: |
          uv sync --locked
          make verify
          make demo
          make package-check
      - name: Generate SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: .
          format: cyclonedx-json
          output-file: dist/obligation-receipts-${{ needs.authorize.outputs.release-tag }}.cdx.json
          upload-artifact: false
      # The manifest the publication jobs check against, written before the
      # candidate-wide one so that it is itself covered by it and by the
      # attestation below. Paths are recorded relative to `dist/` (`./name`),
      # because the publish job verifies them from inside `dist/` after
      # downloading the artifact -- a `dist/name` entry would not resolve there
      # and `sha256sum -c` would report a missing file rather than a match.
      - name: Record the manifest of distributions that may be published
        run: |
          set -euo pipefail
          (cd dist && sha256sum ./*.whl ./*.tar.gz > DIST-SHA256SUMS)
          test -s dist/DIST-SHA256SUMS
      - name: Record candidate checksums
        run: sha256sum dist/* > dist/SHA256SUMS
      - name: Attest exact candidate artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign candidate checksums (keyless)
        run: cosign sign-blob --yes --bundle dist/SHA256SUMS.sigstore.json dist/SHA256SUMS
      # Extracted here because this job holds the checkout; the publication jobs
      # below are checkout-free by design and cannot read CHANGELOG.md.
      - name: Extract the CHANGELOG section as release notes
        run: |
          set -euo pipefail
          awk -v ver="${RELEASE_TAG#v}" '
            index($0, "## [" ver "]") == 1 { found=1; print; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Upload immutable candidate inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obligation-receipts-${{ needs.authorize.outputs.release-tag }}
          path: dist/
          if-no-files-found: error
      # The distributions on their own, so the PyPI job receives the two files
      # it may upload and nothing else. A second build's output would not be
      # covered by the attestation above, so the publish job is given bytes
      # rather than a toolchain.
      - name: Upload the attested distributions for the PyPI job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-attested
          path: |
            dist/*.whl
            dist/*.tar.gz
            dist/DIST-SHA256SUMS
          if-no-files-found: error
      - name: Upload the release notes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  # Split authority: `build` executes repository code under `contents: read`;
  # this job receives `contents: write` and never checks out or executes
  # repository code at all. It re-compares the live tag object with the
  # authorizer's immutable identifier immediately before publishing, so a tag
  # moved between authorization and publication fails here rather than shipping.
  #
  # Idempotent on purpose: a re-run after a partial failure must converge rather
  # than error on an existing release.
  github-release:
    needs: [authorize, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
    steps:
      - name: Download the attested candidate
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: obligation-receipts-${{ needs.authorize.outputs.release-tag }}
          path: dist
      - name: Download the release notes
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-notes
      - name: Recheck the immutable tag object before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
      - name: Publish the GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 \
            || gh release create "$RELEASE_TAG" --title "obligation-receipts $RELEASE_TAG" \
                 --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" dist/* --clobber

  pypi-publish:
    needs: [authorize, build, github-release]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/obligation-receipts
    permissions:
      contents: read
      # OIDC token for PyPI Trusted Publishing. There is no long-lived upload
      # token anywhere in this repository, and `tests/test_supply_chain.py`
      # refuses one.
      id-token: write
    env:
      RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
    steps:
      - name: Download the attested distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-attested
          path: dist
      # Publish the exact bytes `build` produced and Sigstore-attested. This job
      # has no toolchain and never rebuilds: a rebuilt wheel would not be
      # covered by the attestation, and a digest mismatch here fails the release
      # rather than uploading something nobody attested.
      - name: Re-check the distribution digests against the attested manifest
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c DIST-SHA256SUMS
          # Not a distribution file, and the uploader takes `dist/` wholesale.
          rm DIST-SHA256SUMS
      - name: Recheck the immutable tag object before publication
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_OBJECT_SHA: ${{ needs.authorize.outputs.tag-object-sha }}
        run: |
          set -euo pipefail
          LIVE_TAG_OBJECT="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" --jq .object.sha)"
          test "${LIVE_TAG_OBJECT}" = "${TAG_OBJECT_SHA}"
      # Requires a one-time PyPI Trusted Publisher for project
      # `obligation-receipts`: owner ChelseaKR, repository obligation-receipts,
      # workflow `release.yml`, environment `pypi`. Until that exists on PyPI
      # this step fails with an OIDC trust error, which is the correct outcome
      # -- the alternative would be a stored API token.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Publication is not evidence of a working package. This job pulls what PyPI
  # actually serves and runs it, so a release that uploaded successfully but
  # cannot be installed or invoked fails the release run instead of sitting
  # green.
  verify-published:
    needs: [authorize, build, pypi-publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      attestations: read
    env:
      RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
    steps:
      - name: Download the attested distributions
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: dist-attested
          path: dist
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: false
      - name: Verify the Sigstore-backed attestation on the published wheel
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh attestation verify dist/*.whl --repo "$GITHUB_REPOSITORY"
      - name: Install the published version from PyPI and invoke it
        run: |
          set -euo pipefail
          uvx --refresh --from "obligation-receipts==${RELEASE_TAG#v}" obligation-receipts --help >/dev/null
