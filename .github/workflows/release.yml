name: release-candidate

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing signed stable SemVer tag (vX.Y.Z)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-candidate
  cancel-in-progress: false

jobs:
  authorize:
    uses: ChelseaKR/portfolio-standards/.github/workflows/release-authorize.yml@3692aa5270d673f91f8571b4fc0ce1c622bf67e5
    permissions:
      contents: read
    with:
      tag: ${{ inputs.tag }}

  build-candidate:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.authorize.outputs.release-commit }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: false
      - name: Require tag and package versions to match
        env:
          RELEASE_TAG: ${{ needs.authorize.outputs.release-tag }}
        run: |
          set -euo pipefail
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "${RELEASE_TAG}" = "v${PACKAGE_VERSION}"
      - name: Verify and build candidate
        run: |
          uv sync --frozen
          make verify
          make demo
          make package-check
          sha256sum dist/* > dist/SHA256SUMS
      - name: Attest exact candidate artifacts
        uses: actions/attest-build-provenance@bd77c077858b8d561b7a36cbe48ef4cc642ca39d # v2.2.2
        with:
          subject-path: dist/*
      - name: Upload immutable candidate inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: obligation-receipts-${{ needs.authorize.outputs.release-tag }}
          path: dist/
          if-no-files-found: error
