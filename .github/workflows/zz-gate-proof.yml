# TEMPORARY. This file exists only to prove that a red `zizmor` check blocks a
# merge once `protect-main` requires it. It is never merged to main and its
# branch is deleted as soon as the observation is recorded.
#
# It trips exactly one zizmor finding (`artipacked`: `actions/checkout` without
# `persist-credentials: false`). That is a missing hardening flag, not an
# exploitable pattern, and the only trigger is a manual dispatch that is never
# issued.
name: gate-proof

on: workflow_dispatch

permissions:
  contents: read

jobs:
  proof:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
