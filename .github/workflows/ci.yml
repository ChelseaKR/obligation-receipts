name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  # A push to a branch is not a superseded pull-request commit. Keying the group
  # on the ref alone gave every commit on `main` ONE shared slot: GitHub allows
  # one running plus one pending run per group, so a second push cancels the run
  # the first commit was still executing (`cancel-in-progress: true`), and a
  # third push evicts the second from the pending slot (`false`). Either way the
  # commit lands with no verdict at all, and it is reported as `cancelled` or is
  # simply absent -- never as red -- so nothing surfaces it.
  #
  # The discriminator below gives each pushed commit its own slot while leaving
  # pull-request runs grouped per PR, so a superseded PR commit is still
  # cancelled. `cancel-in-progress` is deliberately unchanged.
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job declares `timeout-minutes`. GitHub's default is 6 hours, and this
# repository is public with forks: `verify` runs `pytest` over a pull request's
# code, so a fork can decide how long a runner is held. The whole suite takes
# seconds and the slowest job here is a couple of minutes, so these bounds are
# generous by an order of magnitude and still cut a hung or deliberately
# wedged job short. `tests/test_supply_chain.py` asserts every job that runs on
# a runner declares one, and that none exceeds 30 minutes.
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `--locked`, not `--frozen`. `--frozen` installs exactly what uv.lock
      # records and never reads pyproject.toml, so it cannot see the two
      # disagree and exits 0 on a drifted lock -- it will happily install a
      # version the lock does not record. `--locked` re-resolves against the
      # manifest and fails instead. `make verify` re-asserts it (lock-check
      # first, then `uv run --locked` on every gate).
      - name: Install locked environment
        run: uv sync --locked
      - name: Verify
        run: make verify
      - name: Exercise and replay the synthetic example
        run: make demo

  dogfood-action:
    # Runs the composite action in this repository against its own example, so
    # the published integration is exercised on every pull request rather than
    # only when a consumer complains. `fail-on: any` is deliberate here: the
    # example manifest evaluates to `accepted_with_findings` (exit 0), so any
    # movement to 1, 3 or 4 should turn this job red.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate the example through the local action
        # `$/`, GitHub's self-repository syntax, rather than `./`. Both resolve
        # to this repository at the commit the workflow is running, but `./`
        # resolves through the *runner's filesystem* -- whatever a previous step
        # left in the workspace -- while `$/` is resolved by Actions itself and
        # cannot be pointed at something cloned at runtime. zizmor's
        # `self-repository` audit reports the `./` form from v1.30.0 onward.
        uses: $/
        with:
          mode: evaluate
          manifest: examples/accessibility-acceptance/obligations.toml
          evidence-root: examples/accessibility-acceptance/evidence
          receipt: ${{ runner.temp }}/receipt.json
          fail-on: any
          # `github.sha` is the pull request's merge commit, so the dogfood run
          # installs the merged state rather than the raw head, which also keeps
          # CodeQL's untrusted-checkout query satisfied.
          version: ${{ github.sha }}

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.11.29"
          python-version: "3.12"
      - name: Build and smoke-test wheel
        run: make package-check

  dependency-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.11.29"
          python-version: "3.12"
      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          uv export --locked --no-emit-project --no-hashes > /tmp/requirements.txt
          # Count requirements, not bytes: the export always carries a comment
          # header, so `test -s` is true even when nothing would be audited.
          count="$(grep -cvE '^[[:space:]]*(#|$)' /tmp/requirements.txt || true)"
          if [ "${count}" -eq 0 ]; then
            echo "::error::export produced zero requirements; this audit would be vacuous"
            exit 1
          fi
          echo "auditing ${count} locked requirements"
          uvx --from pip-audit==2.10.1 pip-audit --strict --requirement /tmp/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    # Bounds a scan of every commit reachable from HEAD -- 57 of them today --
    # rather than of one diff. The earlier note here said the job "clones the
    # full history before scanning it", which read as though the clone were what
    # made it a history scan. It was not, and the job proved it: the clone was
    # already full while the scan read a single commit.
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Puts every commit on disk. NECESSARY, and on its own NOT SUFFICIENT:
          # how much history is fetched and how much of it the scanner is asked
          # to read are two different decisions, and only the second one is made
          # below. This line has been here the whole time the check was reading
          # one commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Secret scan (gitleaks, full history)
        # This step was `gitleaks/gitleaks-action`, which picks its scan range
        # from the triggering event. On a push carrying several commits it runs
        # `gitleaks detect --log-opts=--no-merges --first-parent BASE^..HEAD`;
        # on a push carrying exactly ONE -- which every squash merge into `main`
        # is, and every merge into `main` here is a squash merge -- it runs
        # `--log-opts=-1`, i.e. exactly one commit. On a pull request it reads
        # that pull request's own commits. This workflow's `on:` block is `push`
        # and `pull_request` and nothing else: no `schedule`, no
        # `workflow_dispatch`, and those are the two events for which the action
        # passes no range at all. So no run of this required check has ever read
        # more than one commit or one diff of `main`'s 57, and a credential
        # added in one commit and deleted in the next was invisible to it.
        #
        # A pinned, checksum-verified binary invoked as `gitleaks git .` with no
        # range argument walks every commit reachable from HEAD, identically on
        # every event, so what gets scanned no longer depends on how the run was
        # triggered. `tests/test_secret_scan_reads_history.py` asserts the
        # invocation rather than the checkout depth, and reads this file with
        # comments stripped so the two names above cannot satisfy it.
        run: |
          set -euo pipefail
          GL=8.30.1
          BASE="https://github.com/gitleaks/gitleaks/releases/download/v${GL}"
          ARCHIVE="gitleaks_${GL}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${ARCHIVE}" "${BASE}/${ARCHIVE}"
          curl -sSfL -o /tmp/gitleaks_checksums.txt "${BASE}/gitleaks_${GL}_checksums.txt"
          (cd /tmp && grep "  ${ARCHIVE}$" gitleaks_checksums.txt | sha256sum --check --strict)
          tar -xzf "/tmp/${ARCHIVE}" -C /tmp gitleaks
          /tmp/gitleaks git . --no-banner --redact --exit-code 1

  sast:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # fetches the p/python ruleset from the registry first
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true
          version: "0.11.29"
          python-version: "3.12"
      # Every top-level directory that holds tracked Python, which
      # `tests/test_supply_chain.py` derives from `git ls-files` and asserts
      # against this line. `scripts/` was outside the scan while being inside
      # strict mypy and holding `check_wheel.py`, a gate implementation this
      # workflow runs -- an `os.system(sys.argv[1])` added there was invisible
      # to `src tests` and is a blocking finding once `scripts` is named.
      - name: Semgrep
        run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python scripts src tests

  zizmor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          # Code scanning is available on this public repository but is not
          # configured (`code-scanning/default-setup` reports
          # state: not-configured), so the default SARIF-upload path
          # (advanced-security: true) still fails at the upload step. Emit
          # plain GitHub Actions annotations instead; zizmor's own exit code
          # still fails the job on real findings. Flip this to true in the
          # same change that configures code scanning -- the blocker is
          # configuration now, not repository visibility.
          advanced-security: false
          annotations: true

      # The same question zizmor's `impostor-commit` audit asks, asked a second
      # way. It lives in this job rather than a job of its own because the two
      # ask it of the same lines, and because the branch ruleset names required
      # checks by job id.
      #
      # `impostor-commit` used to be disabled repo-wide in .github/zizmor.yml:
      # release.yml pinned a reusable workflow in the private
      # ChelseaKR/portfolio-standards, this workflow's repo-scoped GITHUB_TOKEN
      # 404s on it, and older zizmor aborted the whole file's audit on that
      # access error rather than failing closed -- so no pinned reference in
      # the file was audited. #84 repointed that pin at the public
      # ChelseaKR/.github copy, every pin is now readable, and the config file
      # is gone: the audit runs.
      #
      # This step stays, because it is the stronger of the two. A 40-hex pin
      # proves format, not identity: the digest gate in
      # tests/test_supply_chain.py matches `@([0-9a-f]{40})`, so swapping a real
      # SHA for one out of an attacker's fork of the same action kept CI green.
      #
      # The obvious check does not close it. Forks share the upstream repository's
      # git object store, so `repos/<owner>/<repo>/commits/<sha>` resolves a commit
      # that exists only in a fork -- measured against actions/checkout, which
      # returned 7977a57c26cae21dcd2dd2484e8ca8a53280752d, the head of a
      # third-party fork, with HTTP 200. A gate built on that call would pass the
      # exact substitution it exists to catch.
      #
      # Refs are not shared. So the question asked here is the one that
      # distinguishes the two: is the pinned SHA a tag *in* the repository the pin
      # names? Every pin in this repository is a release tag, which is what
      # Dependabot writes, so a pin that is not a tag is a pin to explain.
      - name: Resolve every pinned SHA against the repository it names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Empty, and it should stay empty. This list existed for exactly one
          # entry -- ChelseaKR/portfolio-standards, which is private and owned
          # by another account, so this workflow's repo-scoped GITHUB_TOKEN
          # 404s on a genuine pin. #84 repointed release.yml at the public
          # ChelseaKR/.github copy of the same reusable workflow, so every pin
          # in this repository is now in a repository this token can read and
          # nothing needs skipping. tests/test_supply_chain.py asserts this
          # list names only repositories that are actually pinned, so it
          # cannot grow into a way to exempt a public action.
          UNREADABLE_PINS: ""
        run: |
          set -euo pipefail
          # `uses[:]` rather than the plain key: this line is inside a file the
          # digest-pin gate reads as text, and a plain one would look to it
          # like an unpinned action reference.
          # `.github/workflows` AND `action.yml`. The composite action pins
          # third-party actions exactly as a workflow does and is the file OTHER
          # repositories execute, so a pin left out of this scan is a pin nothing
          # resolves. tests/test_supply_chain.py holds this path list equal to the
          # file set the digest gate reads, so the two cannot drift apart again.
          pins="$(grep -rhoE '^[[:space:]]*(-[[:space:]]+)?uses[:][[:space:]]*[^@[:space:]]+@[0-9a-f]{40}' .github/workflows action.yml \
            | sed -E 's/.*[[:space:]]([^@[:space:]]+)@([0-9a-f]{40})$/\1 \2/' \
            | awk '{ split($1, part, "/"); print part[1] "/" part[2], $2 }' \
            | sort -u)"
          if [ -z "${pins}" ]; then
            echo "::error::no pinned action references found; this gate would be vacuous"
            exit 1
          fi
          echo "resolving $(printf '%s\n' "${pins}" | wc -l) distinct pins"
          status=0
          while read -r repo sha; do
            case " ${UNREADABLE_PINS} " in
              *" ${repo} "*)
                echo "skip ${repo}@${sha}: private to another account, this token cannot read it"
                continue
                ;;
            esac
            if ! refs="$(gh api --paginate "repos/${repo}/git/matching-refs/tags/" --jq '.[] | [.object.sha, .ref] | @tsv')"; then
              echo "::error::cannot list the tags of ${repo}; failing closed rather than passing an unverified pin"
              status=1
              continue
            fi
            tag="$(printf '%s\n' "${refs}" | awk -v want="${sha}" '$1 == want { printf "%s%s", (seen++ ? "," : ""), $2 } END { print "" }')"
            if [ -z "${tag}" ]; then
              # An annotated tag names a tag object, not the commit it wraps.
              if ! deref="$(gh api --paginate "repos/${repo}/tags" --jq '.[] | [.commit.sha, .name] | @tsv')"; then
                echo "::error::cannot dereference the tags of ${repo}; failing closed"
                status=1
                continue
              fi
              tag="$(printf '%s\n' "${deref}" | awk -v want="${sha}" '$1 == want { printf "%s%s", (seen++ ? "," : ""), $2 } END { print "" }')"
            fi
            if [ -z "${tag}" ]; then
              echo "::error::${repo}@${sha} is not a tag in ${repo}. A 40-hex SHA that resolves through the shared fork object store is not evidence the commit belongs to ${repo}."
              status=1
              continue
            fi
            echo "ok ${repo}@${sha} -> ${tag}"
          done <<PINS
          ${pins}
          PINS
          exit "${status}"
