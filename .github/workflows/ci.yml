name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock
      # `--locked`, not `--frozen`. `--frozen` installs exactly what uv.lock
      # records and never reads pyproject.toml, so it cannot see the two
      # disagree and exits 0 on a drifted lock -- it will happily install a
      # version the lock does not record. `--locked` re-resolves against the
      # manifest and fails instead. `make verify` re-asserts it (lock-check
      # first, then `uv run --locked` on every gate).
      - name: Install locked environment
        run: uv sync --locked
      - name: Verify
        run: make verify
      - name: Exercise and replay the synthetic example
        run: make demo

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
      - name: Build and smoke-test wheel
        run: make package-check

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
      - name: Audit locked dependencies
        run: |
          set -euo pipefail
          uv export --locked --no-emit-project --no-hashes > /tmp/requirements.txt
          # Count requirements, not bytes: the export always carries a comment
          # header, so `test -s` is true even when nothing would be audited.
          count="$(grep -cvE '^[[:space:]]*(#|$)' /tmp/requirements.txt || true)"
          if [ "${count}" -eq 0 ]; then
            echo "::error::export produced zero requirements; this audit would be vacuous"
            exit 1
          fi
          echo "auditing ${count} locked requirements"
          uvx --from pip-audit==2.10.1 pip-audit --strict --requirement /tmp/requirements.txt

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # required on private repos: gitleaks-action lists the PR's commits
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.29"
          python-version: "3.12"
      # Every top-level directory that holds tracked Python, which
      # `tests/test_supply_chain.py` derives from `git ls-files` and asserts
      # against this line. `scripts/` was outside the scan while being inside
      # strict mypy and holding `check_wheel.py`, a gate implementation this
      # workflow runs -- an `os.system(sys.argv[1])` added there was invisible
      # to `src tests` and is a blocking finding once `scripts` is named.
      - name: Semgrep
        run: uvx --from semgrep==1.168.0 semgrep scan --error --metrics off --config p/python scripts src tests

  zizmor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          # Code scanning / GitHub Advanced Security is not enabled on this
          # private repo, so the default SARIF-upload path
          # (advanced-security: true) always fails at the upload step with
          # "Code scanning is not enabled for this repository." Emit plain
          # GitHub Actions annotations instead; zizmor's own exit code
          # still fails the job on real findings.
          advanced-security: false
          annotations: true

      # The audit zizmor is configured not to run, run here instead. It
      # lives in this job rather than a job of its own because the two ask
      # the same question of the same lines, and because the branch ruleset
      # names required checks by job id.
      #
      # A 40-hex pin proves format, not identity. Nothing in this repository asked
      # whether a pinned SHA belongs to the repository the pin names: the digest
      # gate in tests/test_supply_chain.py matches `@([0-9a-f]{40})`, and zizmor's
      # `impostor-commit` audit -- the rule that would ask -- is disabled repo-wide
      # in .github/zizmor.yml for a real access reason that nonetheless leaves all
      # 9 distinct pinned refs unasked. Swapping a real SHA for one out of an
      # attacker's fork of the same action kept CI green.
      #
      # The obvious check does not close it. Forks share the upstream repository's
      # git object store, so `repos/<owner>/<repo>/commits/<sha>` resolves a commit
      # that exists only in a fork -- measured against actions/checkout, which
      # returned 7977a57c26cae21dcd2dd2484e8ca8a53280752d, the head of a
      # third-party fork, with HTTP 200. A gate built on that call would pass the
      # exact substitution it exists to catch.
      #
      # Refs are not shared. So the question asked here is the one that
      # distinguishes the two: is the pinned SHA a tag *in* the repository the pin
      # names? Every pin in this repository is a release tag, which is what
      # Dependabot writes, so a pin that is not a tag is a pin to explain.
      - name: Resolve every pinned SHA against the repository it names
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # ChelseaKR/portfolio-standards is private and owned by another
          # account, so this workflow's repo-scoped GITHUB_TOKEN cannot read
          # it: the API 404s on a genuine pin. It is skipped rather than
          # failed, and verified by hand at every bump -- the same access
          # limit that forces zizmor's impostor-commit audit off entirely.
          # tests/test_supply_chain.py asserts this list names only
          # repositories that are actually pinned, so it cannot grow into a
          # way to exempt a public action.
          UNREADABLE_PINS: ChelseaKR/portfolio-standards
        run: |
          set -euo pipefail
          # `uses[:]` rather than the plain key: this line is inside a file the
          # digest-pin gate reads as text, and a plain one would look to it
          # like an unpinned action reference.
          pins="$(grep -rhoE '^[[:space:]]*(-[[:space:]]+)?uses[:][[:space:]]*[^@[:space:]]+@[0-9a-f]{40}' .github/workflows \
            | sed -E 's/.*[[:space:]]([^@[:space:]]+)@([0-9a-f]{40})$/\1 \2/' \
            | awk '{ split($1, part, "/"); print part[1] "/" part[2], $2 }' \
            | sort -u)"
          if [ -z "${pins}" ]; then
            echo "::error::no pinned action references found; this gate would be vacuous"
            exit 1
          fi
          echo "resolving $(printf '%s\n' "${pins}" | wc -l) distinct pins"
          status=0
          while read -r repo sha; do
            case " ${UNREADABLE_PINS} " in
              *" ${repo} "*)
                echo "skip ${repo}@${sha}: private to another account, this token cannot read it"
                continue
                ;;
            esac
            if ! refs="$(gh api --paginate "repos/${repo}/git/matching-refs/tags/" --jq '.[] | [.object.sha, .ref] | @tsv')"; then
              echo "::error::cannot list the tags of ${repo}; failing closed rather than passing an unverified pin"
              status=1
              continue
            fi
            tag="$(printf '%s\n' "${refs}" | awk -v want="${sha}" '$1 == want { printf "%s%s", (seen++ ? "," : ""), $2 } END { print "" }')"
            if [ -z "${tag}" ]; then
              # An annotated tag names a tag object, not the commit it wraps.
              if ! deref="$(gh api --paginate "repos/${repo}/tags" --jq '.[] | [.commit.sha, .name] | @tsv')"; then
                echo "::error::cannot dereference the tags of ${repo}; failing closed"
                status=1
                continue
              fi
              tag="$(printf '%s\n' "${deref}" | awk -v want="${sha}" '$1 == want { printf "%s%s", (seen++ ? "," : ""), $2 } END { print "" }')"
            fi
            if [ -z "${tag}" ]; then
              echo "::error::${repo}@${sha} is not a tag in ${repo}. A 40-hex SHA that resolves through the shared fork object store is not evidence the commit belongs to ${repo}."
              status=1
              continue
            fi
            echo "ok ${repo}@${sha} -> ${tag}"
          done <<PINS
          ${pins}
          PINS
          exit "${status}"
