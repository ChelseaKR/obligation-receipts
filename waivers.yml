# Waiver and exception registry for obligation-receipts.
# Schema: STANDARDS/WAIVERS-SCHEMA.md (version 1). No entry, no waiver.
#
# WVR-008 (CICD-13, the CodeQL `language: actions` element) was RETIRED on
# 2026-09-04 rather than renewed. It was granted on the premise that "code
# scanning / GitHub Advanced Security is not enabled on this private
# repository", and it named its own revisit trigger: "Revisit when either code
# scanning is enabled for this repository or the repository becomes public."
# Both halves have fired. `gh repo view --json isPrivate` returns false, and
# `GET /repos/ChelseaKR/obligation-receipts/code-scanning/default-setup`
# returns state `not-configured` for languages `actions` and `python`, while
# the alerts endpoint returns "no analysis found" rather than "code scanning is
# not enabled". The analysis is available and merely unconfigured, so the
# argument that a CodeQL workflow "can only ever fail" is no longer true and
# there is nothing left to waive.
#
# The gap itself is real and open, tracked in
# https://github.com/ChelseaKR/obligation-receipts/issues/16. Adding the
# workflow is follow-up work under `.github/`; this registry records only that
# the exemption is withdrawn. It is withdrawn now rather than at its
# 2026-11-30 expiry because the expiry test catches decay by time, and this
# waiver decayed by a change of fact roughly twelve weeks earlier.
# WVR-009 (REL-14, the `release_workflow` control) was RETIRED on 2026-09-06,
# on its own stated trigger. It read: "Revisit when M0 exits and publication
# authority is actually wanted; the control becomes implementable in the same
# change that adds it." This is that change. `release.yml` now implements the
# whole hardened shape the control recognizes -- a workflow_dispatch tag input,
# a trusted-main authorization job, gates re-run at the authorized commit, and
# checkout-free write jobs that publish the exact attested bytes -- so there is
# nothing left to waive and the honest record is the implementation rather than
# an exemption from it.
#
# What the waiver's reason asserted is no longer true and is preserved here so
# the change of fact is legible: it said `contents: write`, `gh release create`
# and every publish action were absent and that `tests/test_supply_chain.py`
# asserted their absence. All three are now present, in `github-release` and
# `pypi-publish` only, and that same test file asserts the CONFINEMENT rather
# than the absence: every other workflow is still forbidden to publish
# anything, the build job may not, and the PyPI upload must be Trusted
# Publishing over OIDC with no stored credential.
#
# Retiring this left the registry empty for the first time. That is a real
# state, not a missing file: see `docs/RELEASE.md` for the preconditions on
# publication that remain, none of which is a waived control.
version: 1
waivers: []
