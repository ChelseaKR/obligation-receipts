repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.22
    hooks:
      - id: ruff
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy --strict
        # `--locked`, not a bare `uv run`. A bare `uv run` syncs implicitly,
        # and an implicit sync re-resolves and rewrites uv.lock in the working
        # tree when it disagrees with pyproject.toml. This hook runs at
        # pre-push: the drift would be repaired silently in the instant before
        # the push, leaving the rewritten lock behind for the next `git add`
        # to sweep up. `--locked` refuses to run instead of relocking.
        entry: uv run --locked mypy
        language: system
        pass_filenames: false
        stages: [pre-push]
